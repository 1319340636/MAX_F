# =========================================================
# 🌍 FinMAS 认知架构配置 (Academic Balanced-Aggressive)
# 版本: V3.0_Dynamic_Consensus
# 核心思想: 声明式知识注入 + 动态风控 + 记忆驱动决策
# =========================================================

market_types:
  # -------------------------------------------------------
  # 🥇 黄金市场配置 (XAU/USD)
  # -------------------------------------------------------
  gold:
    keywords: ["XAU", "GC=F", "GOLD", "黄金", "伦敦金", "COMEX黄金", "沪金"]
    directional_prior:
        long_bias: 0.65        # 黄金长期结构性偏多
        short_penalty: 0.75    # 所有 SHORT 信心 ×0.75
    # [Hard Limits] 硬性风控参数 (代码强制执行)
    stop_loss_pct: 0.015        # 1.5% 宽幅止损 (适应高波动，防扫损)
    take_profit_pct: 0.035      # 3.5% 止盈 (盈亏比 > 2.3:1)
    single_position_pct: 0.15   # 单笔上限 15% (单发子弹要有力度)
    total_position_pct: 0.30    # 总仓位上限 30% (永远保留 70% 现金作为安全垫)
    flashbulb_vol: 0.018        # 1.8% 波动率触发“闪光灯记忆”机制
    memory_decay_factor: 0.06   # 记忆衰减系数 (低衰减，模拟黄金的长周期属性)

    # [Role Definitions] 角色人格与偏见注入
    roles:
      Risk_Manager: >
        【核心任务】：在不爆仓的前提下，允许利润回撤以换取更大空间。
        1. 只有当波动率 > 1.8% (宽容模式) 时，才强制行使“一票否决权”或要求空仓。
        2. 【连亏熔断】：如果系统连续 3 笔交易亏损，强制要求 Technical_Analyst 下一笔交易信心必须 > 0.8 才能开仓，否则强制空仓休息 2 天。
        3. 协同作战：当 Technical_Analyst 信心 > 0.7 时，允许其突破常规仓位限制，不设单日止损，只看最终盈亏。

      Technical_Analyst: >
        【激进指令】：你是战场的先锋，拒绝平庸的 HOLD！
        1. 趋势定义：MA20 是短期进攻线，MA60 是生命线。价格在 MA20 上方即视为多头，只找做多机会；下方只找做空机会。
        2. 信号分级与仓位建议：
           - 强信号 (信心≥0.7)：全力进攻，建议打满单笔额度 (100% Limit)。
           - 中信号 (信心0.5-0.7)：试探进攻，建议使用 50% 单笔额度。
        3. 禁令：严禁连续 3 天给出 HOLD。
        4. 【豁免条款】：如果当日波动率极低 (<0.6%)，允许给出 HOLD 建议，不要强行交易。

      Macro_Economist: >
        【宏观定调】：你负责在大方向上给 Tech 壮胆。
        1. 实际利率与金价负相关是铁律，但允许有 3 天的反应滞后。
        2. 重大事件（非农/CPI/FOMC）前夕，不要机械减仓，而是根据市场预期偏差（Surprise）提前押注。
        3. 如果通胀预期抬头，即使利率上涨，也坚决看多黄金（抗通胀属性优先）。

      Fundamental_Analyst: >
        【数据猎手】：寻找供需失衡的瞬间。
        1. 央行购金是长线利多，只要月度数据不为负，长期倾向保持 LONG。
        2. 重点监控 ETF 资金流向，资金净流入日，严禁做空。

      Sentiment_Watcher: >
        【逆向狙击手】：你是团队的最后一道防线。
        1. 平时保持静默，不要干扰趋势交易。
        2. 仅仅在 Technical_Analyst 极度狂热 (信心>0.9) 且 RSI 超买 (>80) 时，才发出做空信号进行对冲。

  # -------------------------------------------------------
  # 🪙 加密市场配置 (Crypto)
  # -------------------------------------------------------
  crypto:
    keywords: ["BTC", "ETH", "BITCOIN"]
    stop_loss_pct: 0.04
    take_profit_pct: 0.08
    single_position_pct: 0.10
    total_position_pct: 0.15
    flashbulb_vol: 0.040
    memory_decay_factor: 0.15
    roles:
      Risk_Manager: "极高波动环境。波动率 > 4% 触发认知重组，警惕杠杆风险。"
      Technical_Analyst: "趋势追踪。均线系统信号优于形态，关注 24h 成交量异动。"
      Macro_Economist: "流动性 M2 驱动。关注纳斯达克相关性及减半周期影响。"
      Fundamental_Analyst: "关注交易所流向(Exchange Flow)及链上活跃地址数。"
      Sentiment_Watcher: "关注恐慌贪婪指数，极度贪婪时尝试做空。"

# =========================================================
# 🧠 Memory Hierarchy (记忆架构参数)
# =========================================================
memory_hierarchy:
  # Layer 1: Working Memory (桌面)
  working_top_k: 75             # 关键：开启 60 条记忆检索 (博学模式)
  working_call_rule_gold: "优先调用评分≥3.0、15天内活跃记忆，按「评分+避险/实际利率相关度」排序。"

  # Layer 2: Episodic Memory (抽屉)
  standard_capacity: 200
  crisis_capacity: 400
  crisis_trigger_gold: "波动率 > 1.2% 立即扩容至 400，持续 10 个交易日。"

  # Layer 3: Semantic Memory (仓库)
  consolidation_threshold: 5.0  # 评分 > 5.0 的记忆永久固化
  pruning_days:
    gold: 45                    # 黄金记忆保留 45 天
    crypto: 20                  # 币圈记忆保留 20 天

# =========================================================
# 📜 Principles (原则库 - 动态注入 Prompt)
# 注意：此处不再硬编码数字，而是引用 Hard Limits
# =========================================================
principles:
  # A. 通用原则 (Common Sense) - 所有智能体必守的底层共识，最高优先级（含核心风控+防拟合+操作限制）
  common:
    - "风险控制是盈利的基础，适度冒险是收益的来源。"
    - "无明确信号时总仓位保持低位，但在强趋势下应果断加仓。"
    - "严格遵守系统设定的 Hard Limits (单笔及总仓位上限)，禁止手动突破。"
    - "允许试错，但连续 2 次亏损后，建议 Agent 主动降低推荐的仓位比例。"
    - "当技术面和宏观面出现严重背离时，必须强制输出 HOLD，置信度设为 0。"
    - "若 24 小时内预期波幅小于 0.4%，则视为无意义波动，强制输出 HOLD，不参与任何交易。"
    - "所有定量规则（止损、R值、波动率阈值）可根据交易标的特性动态调整，调整幅度不超过基础值的50%，且需遵守对应标的阈值模板。"
    - "【操作限制】单日全局最大操作次数≤3次，单标的单日最大操作次数≤2次，避免无意义频繁交易。"
    - "【规则优先级】强制HOLD/止损/规避/离场类规则 > 仓位调整类规则 > 建仓/加仓类规则，规则冲突时按此优先级执行。"
    - "【极端行情熔断】当标的单日波动率≥5%或出现跳空缺口/涨跌停时，强制触发熔断，所有智能体暂停自动操作，转为HOLD状态。"

  # B. 因果逻辑 (Causal Logic) - 智能体方向判断的核心锚点（补充防过拟合规则）
  causal_logic: 
    - "宏观提供背景，技术提供时机，情绪提供仓位参考。"
    - "【历史教训权重】在决策时，必须赋予历史教训（Lessons）最高权重。"
    - "【历史教训防拟合】历史教训样本量需≥50个，相似度判定需结合宏观+技术+情绪多维度特征，禁止单特征拟合；若当前行情与记忆中任何失败案例相似度 > 80%，必须强制执行规避动作。"
    - "重要变量需有 2 个交易日确认，关键变量需有 3 个交易日验证。"
    - "技术面与宏观面出现核心信号反向时，判定为严重背离：宏观利多但技术面破位关键支撑/宏观利空但技术面突破关键压力，均触发强制HOLD。"

  # C. 趋势交易原则 (Trend Trading) - 趋势类智能体的具体判断规则（波动率梯度分层）
  trend_trading:
    - "趋势初期适度参与，趋势中期稳健持有，趋势末期逐步退出。"
    - "MA60 向上 + 价格在 MA20 上方：默认做多环境，寻找回调买入点。"
    - "MA60 向下 + 价格在 MA20 下方：默认做空环境，优先寻找做空机会。"
    - "波动率分层定义交易模式：波动率 0.5%-0.8% 为震荡市，转为区间交易模式 (Range Trading) 高抛低吸；波动率 < 0.5% 为无意义波动，强制输出 HOLD；波动率 ≥ 0.8% 为趋势市，按趋势方向交易。"

  # D. 持仓管理原则 (Position Management) - 持仓智能体的精细化操作准则（补充极端行情条款）
  position_management:
    hold_style:
      - "主动止盈：盈利达到 1.5R（风险回报比）时，移动止损至保本位；达到 2.5R 时，止盈 50% 仓位，剩余50%仓位将止损上移至2R位置，直至趋势破位或触及上移后止损。"
      - "被动止损：初始止损设为入场价的 1.5%（低波动率标的）-2%（高波动率标的），波动率≥1.5%时止损上调至2%；极端行情（跳空/涨跌停/流动性枯竭）下，放弃固定价位止损，转为市价快速离场，触及止损无条件执行。"
      - "趋势持仓：在趋势中继形态（如旗形、三角整理）出现时，保持持仓，直至突破失败或反向信号出现；若同时触发强制HOLD规则，优先执行HOLD。"
      - "时间止损：单笔持仓超过 5 个交易日无明确盈利进展（价格在成本 ±1% 内震荡），主动减仓 50% 或直接离场；若触发单日操作次数限制，可顺延至下一交易日执行。"
      - "分批离场：盈利仓位分 2-3 批离场，最后一批持仓可搏取趋势末端利润，但需严格跟踪止盈/止损，不盲目扛单。"
    
    adjustment:
      - "浮盈加仓：趋势明确（MA60/MA20方向一致）且已盈利 1R 以上时，在价格回调至MA20附近且未破位时加仓一次，加仓后总仓位不超过系统单笔仓位上限；若叠加触发其他规则，暂停加仓。"
      - "亏损绝不加仓：任何亏损仓位禁止补仓、摊薄成本，触及止损必须无条件离场，该规则为持仓调整类最高优先级。"
      - "对冲持仓：在重大事件（如财报、利率决议）前，可持有反向期权进行时间对冲，但不对冲 delta 风险；重大事件落地后，若行情无明确方向（涨跌幅<0.5%），立即平掉对冲期权且主仓位降低至50%；若行情突破关键价位，择机平掉对冲期权并保持主仓位；极端行情下立即平掉所有对冲仓位。"

# =========================================================
# ⚙️ Dynamic Adjustment (完整增强版)
# =========================================================
dynamic_adjustment:
  # 1. 绩效反馈 (基于近期胜率)
  performance_based_adjustment:
    - "【连胜奖励】若最近 3 次决策正确，建议大胆使用 100% 的单笔额度上限。"
    - "【连败惩罚】若最近 2 次决策错误，必须主动将建议仓位降至单笔额度的 50% 以内。"
    - "【止损动态】盈利状态下，可适当放宽止损以博取长线；亏损状态下，必须收紧止损。"
    - "【大亏防御】若单日回撤 > 1.5%，次日建议暂停开新仓或仅允许 10% 的微量试仓。"

  # 2. 市场环境自适应 (基于 VIX 和 波动率)
  market_adaptive:
    - "【低波动 (Vol < 0.8%)】：这是“死鱼行情”或“暴发前夜”。允许在关键支撑位埋伏，仓位可适度激进。"
    - "【正常波动 (0.8-1.5%)】：这是标准趋势行情。请严格按照 Technical_Analyst 的信心评分来决定仓位。"
    - "【高波动 (1.5-2.5%)】：风险加剧。建议降低 30% 的标准仓位，且严禁追涨杀跌。"
    - "【极端波动 (>2.5%)】：进入“危机模式”。暂停新开仓，只处理旧仓位止损，直到波动率回归正常。"

  # 3. 时间周期调整 (Time-Based Seasonality)
  # ⚠️ Agent 需根据 Date 字段自行推断月初/月末
  time_based:
    - "【月初效应】：通常资金面宽裕，可对多头信号给予更高权重。"
    - "【月中操作】：进入数据发布密集期（CPI/非农），以稳健为主，避免赌单边。"
    - "【月末效应】：通常面临期权交割或获利了结，建议收缩战线，仓位上限建议下调 20%。"
    - "【假日风险】：如果日期临近长假（如圣诞/春节），必须提示降低杠杆。"